name: Chaos Draft tracker

# A SEPARATE, SEASONAL side-project. Nothing here touches the CRL tracker.
#
# OWNERSHIP RULE -- the third leg of the rule in fetch.yml and update.yml:
#   * fetch.yml   writes ONLY master_*.json and fetch_log.json
#   * update.yml  writes ONLY the CRL derived artifacts
#   * chaos.yml   writes ONLY chaos/**
# Disjoint file sets is what lets all three push to main without ever fighting.
#
# WHY IT STOPS ON ITS OWN: this was built to cover one Chaos Draft ladder season. A
# scheduled workflow with no end date outlives its purpose and quietly burns Actions
# minutes for months. SEASON_END below short-circuits every run after that date -- to
# extend it, just bump the date.
#
# Required secret: CR_API_TOKEN (already set for the CRL workflows -- shared, read-only).

env:
  # Ladder season end (+ a small buffer). Runs after this exit immediately.
  SEASON_END: '2026-08-18'
  # Hard ceiling on tracked players -- every one costs an API call every 30 minutes.
  CHAOS_MAX_ROSTER: '100'
  # A DISCOVERED opponent needs 2+ sightings AND this many trophies to be promoted.
  # Seeds bypass it. 2900 is ~the 99th percentile of Chaos Draft players, deliberately
  # strict so matchmaking noise doesn't consume slots.
  #
  # EXPECT PROMOTIONS TO ACCELERATE LATE IN THE SEASON: trophies inflate as players climb,
  # so the pool clearing 2900 grows over the 8 days. That's the intended shape -- slow at
  # first, filling as the genuine top of the ladder separates itself. CHAOS_MAX_ROSTER is
  # the backstop if it accelerates faster than expected. Raise this number to tighten.
  CHAOS_MIN_TROPHIES: '2900'

on:
  schedule:
    # EVERY 2 HOURS, at :15 past. Two separate decisions are baked into that:
    #
    # WHY NOT SLOWER: the API returns only a player's last ~25-30 battles across ALL modes.
    # Measured on the baseline archive, the busiest rolling 6-hour window was 80 chaos
    # battles for Batan's alt and 51 for SK xopxsam -- so a 6-hourly fetch would silently
    # drop most of the games from exactly the high-volume top-ladder players this tracker
    # exists to measure. 2h keeps the worst case near the window edge instead of past it.
    #
    # WHY :15 AND NOT :00: fetch.yml runs at :00/:30 and update.yml at the top of every
    # third hour. Sharing a slot would put this side-project in contention with the CRL
    # tracker on two shared resources -- the RoyaleAPI proxy rate limit (same token, same
    # IP) and pushes to main. Both have retries, so a collision is survivable rather than
    # damaging, but CRL is competitive data whose losses are permanent and this is
    # curiosity. Offsetting costs nothing, so CRL gets the clean slots.
    - cron: '15 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chaos-fetch
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Stop if the season is over
        id: season
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "$SEASON_END" ]]; then
            echo "::notice::Chaos Draft season ended $SEASON_END (today $today). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.season.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.season.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy      # numpy powers the card-strength model

      - name: Fetch Chaos Draft battles
        if: steps.season.outputs.run == 'true'
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          CR_API_BASE: https://proxy.royaleapi.dev/v1
        run: |
          for attempt in 1 2 3; do
            if python chaos/fetch_chaos.py; then exit 0; fi
            echo "fetch failed (attempt $attempt); retrying in 30s"; sleep 30
          done
          echo "chaos fetch failed after 3 attempts"; exit 1

      - name: Rebuild reports
        if: steps.season.outputs.run == 'true'
        continue-on-error: true          # a bad report must not cost us the fetched data
        run: python chaos/analyze_chaos.py

      - name: Commit chaos/ ONLY
        if: steps.season.outputs.run == 'true'
        run: |
          git config user.name  "crl-bot"
          git config user.email "actions@users.noreply.github.com"
          # Pathspec-limited on purpose: this workflow must never stage a CRL file.
          git add -- chaos
          if git diff --cached --quiet; then
            echo "No new chaos battles this run."; exit 0
          fi
          git commit -m "Chaos Draft fetch $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected; rebasing onto origin/main and retrying ($attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git merge -X ours --no-edit origin/main || true; }
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "could not push after retries; the next run reconciles (archive is append-only)."
          exit 1
