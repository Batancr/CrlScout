name: Update CRL data & dashboard

# Rebuilds the workbook + dashboard from the battle archive, publishes the dashboard to
# Netlify, posts a "what changed" summary to Discord, and commits the derived data back.
# The large dashboard HTML is NOT committed (kept out of git to avoid bloat) -- it lives on
# Netlify and as a build artifact instead.
#
# THIS WORKFLOW NO LONGER FETCHES (changed 2026-08-06). Fetching moved to fetch.yml, which
# runs every 30 minutes instead of every 3 hours, because the Clash Royale API only returns
# a player's last ~25-30 battles and a 3-hour gap was letting real games age out unseen.
# See the header of fetch.yml for the full reasoning.
#
# OWNERSHIP RULE -- do not break this:
#   * fetch.yml  writes ONLY master_*.json and fetch_log.json
#   * update.yml writes ONLY derived artifacts (CRL_Duel_Decks.xlsx, run_state.json, ...)
# Disjoint file sets is what lets both push to main without the `-X ours` strategy below
# ever discarding freshly fetched battles.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN   - Netlify personal access token   (optional; deploy skipped if unset)
#   NETLIFY_SITE_ID      - Netlify site's API/Site ID       (optional; deploy skipped if unset)
#   DISCORD_WEBHOOK_URL  - Discord channel webhook URL       (optional; notify skipped if unset)
#   (CR_API_TOKEN is still required, but by fetch.yml -- not here.)

on:
  schedule:
    - cron: '0 */3 * * *'        # every 3 hours (UTC)
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write
  actions: write        # needed to purge old artifacts (see the cleanup step)

concurrency:
  group: crl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Before this cap, a run hung by a GitHub-side incident sat at the head of the
    # `crl-update` concurrency group and blocked every later run indefinitely, with no
    # signal that anything was wrong. Now a stuck run dies and the next cron proceeds.
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Fetching now belongs to fetch.yml. If that workflow silently stops (expired
      # CR_API_TOKEN, a long GitHub Actions incident, a disabled schedule), this build would
      # otherwise happily rebuild a dashboard from stale data and look completely healthy.
      # This makes that failure mode visible instead.
      - name: Check archive freshness
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          try:
              log = json.load(open("fetch_log.json"))
              last = datetime.fromisoformat(log[-1]["fetched_at_utc"])
              age = (datetime.now(timezone.utc) - last).total_seconds() / 3600
              print(f"age_hours={age:.1f}")
              print(f"stale={'true' if age > 3 else 'false'}")
              print(f"last_fetch={log[-1]['fetched_at_utc'][:16]}")
          except Exception as e:
              print("age_hours=unknown")
              print("stale=true")
              print(f"last_fetch=unreadable ({type(e).__name__})")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Warn if the archive is stale
        if: steps.freshness.outputs.stale == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 **CRL archive is stale** — last successful fetch: ${{ steps.freshness.outputs.last_fetch }} (${{ steps.freshness.outputs.age_hours }}h ago). fetch.yml should run every 30 min. Check the Actions tab and CR_API_TOKEN."
          echo "$MSG"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            jq -n --arg m "$MSG" '{content: $m}' > stale_payload.json
            curl -sS -H "Content-Type: application/json" -X POST -d @stale_payload.json "$DISCORD_WEBHOOK_URL"
          fi

      - name: Rebuild workbook + dashboard + change summary
        env:
          CRL_HOME: ${{ github.workspace }}
        run: |
          set -e
          python build_duel_workbook.py
          python recalc.py CRL_Duel_Decks.xlsx 300
          python add_ronin_analysis.py
          python add_group_a_analysis.py
          python add_batan_matchup_analysis.py
          python add_group_a_sequencing_analysis.py
          python add_group_a_matchup_prep.py
          python recalc.py CRL_Duel_Decks.xlsx 300
          python build_dashboard.py
          python compute_run_diff.py

      # Netlify deploys cost credits (free plan: ~20/month), so they run ONLY on a manual
      # "Run workflow" click -- never on the every-6-hours schedule. Refresh the live site
      # on demand (e.g. before a match); the scheduled runs still fetch/rebuild/commit/Discord.
      # card_icons/ must ship alongside index.html: as of 2026-08-07 the dashboard links
      # icons as relative "card_icons/<file>.png" paths instead of inlining 41MB of base64,
      # which took the page from ~47MB to ~6MB. Without this copy the site loads but every
      # card image 404s.
      - name: Prepare dashboard for Netlify
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp crl_opponent_scout.html _site/index.html
          cp -r card_icons _site/card_icons
          echo "_site contents: $(du -sh _site | cut -f1), $(ls _site/card_icons | wc -l) icons"

      # Deploys via the netlify-cli npm package rather than netlify/actions/cli@master.
      # That action is an aging Docker wrapper: it spams deprecated `set-output` warnings,
      # costs a container pull on every run, and -- the reason it got replaced -- reports a
      # missing secret as a bare "Authentication required" with no clue which secret is at
      # fault. The explicit guard below says exactly what's wrong instead.
      - name: Deploy dashboard to Netlify
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true          # a missing/invalid Netlify secret must not fail the whole run
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is empty or unset -- skipping deploy."
            exit 0
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_SITE_ID secret is empty or unset -- skipping deploy."
            exit 0
          fi
          npx --yes netlify-cli deploy --dir=_site --prod

      - name: Notify Discord (what changed since last run)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No DISCORD_WEBHOOK_URL secret set; skipping."; exit 0; fi
          if [ ! -f run_summary.txt ]; then echo "No run_summary.txt produced; skipping."; exit 0; fi
          # Roll up gap risk across the ~6 fetch runs that happened since the last rebuild,
          # so any blind window shows up next to the stats it silently corrupted.
          python gap_risk_report.py --window 6 --out gap_rollup.txt || true
          if [ -f gap_rollup.txt ]; then
            printf '\n\n---\n' >> run_summary.txt
            cat gap_rollup.txt >> run_summary.txt
          fi
          # Discord hard-caps messages at 2000 chars.
          head -c 1900 run_summary.txt > discord_body.txt
          jq -n --rawfile msg discord_body.txt '{content: $msg}' > discord_payload.json
          curl -sS -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK_URL"

      - name: Commit refreshed data (dashboard HTML kept out of git; see Netlify / artifact)
        run: |
          git config user.name  "crl-bot"
          git config user.email "actions@users.noreply.github.com"
          # Keep the large (~47MB) dashboard OUT of git history so the repo doesn't bloat.
          git rm --cached --ignore-unmatch crl_opponent_scout.html
          # Stage everything EXCEPT the battle archive. fetch.yml owns those files; staging
          # them here would let the `-X ours` merge below overwrite battles fetched while
          # this (multi-minute) build was running -- silently undoing the whole point of the
          # 30-minute fetch cadence.
          # chaos/ is excluded too: it belongs to chaos.yml (a separate side-project).
          # In practice this job never modifies it, but `git add -A` is broad enough that
          # the exclusion should be explicit rather than relying on that staying true.
          git add -A -- . ':!master_*.json' ':!fetch_log.json' ':!chaos'
          if git diff --cached --quiet; then
            echo "No changes this run."; exit 0
          fi
          git commit -m "Auto update $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Resilient push: if another run (or a manual push) landed on main while this run was
          # building, merge it in -- our freshly-built files win any conflict, remote-only files
          # (e.g. a code change you pushed) are kept -- then push. Retry a few times; if all fail
          # the next scheduled run reconciles anyway (the archive is append-only).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected; syncing with remote and retrying ($attempt)"
            git fetch origin main
            git merge -X ours --no-edit origin/main || git merge --abort || true
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "could not push after retries; the next scheduled run will reconcile."; exit 1

      # ARTIFACT STORAGE -- why this is so restricted (2026-08-06)
      # -----------------------------------------------------------
      # This step used to upload the ~47MB dashboard on EVERY run with 14-day retention.
      # At 8 runs/day that is ~5.3 GB of live storage against a 500 MB free-plan quota, so it
      # was always going to blow up; it just took until now to accumulate. When the quota is
      # hit, upload-artifact errors and -- because it was the last step -- marked otherwise
      # perfectly good runs as FAILED, even though the data was already fetched, rebuilt and
      # committed successfully.
      #
      # Three changes: purge old artifacts first, only upload on a manual run (Netlify is the
      # real distribution channel), and never let this step fail the build again.
      - name: Purge old dashboard artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep only the newest crl-dashboard artifact; delete the rest.
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                  --jq '.artifacts | map(select(.name=="crl-dashboard")) | sort_by(.created_at) | reverse | .[1:] | .[].id' || true)
          for id in $ids; do
            echo "deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      # The downloadable copy is built with CRL_INLINE_ICONS=1 so it stays ONE portable
      # file you can open offline with no sibling card_icons/ folder. The Netlify copy
      # above uses the small linked-icon build instead. Two different tradeoffs, one
      # pipeline: fast to load online, self-contained offline.
      - name: Build a self-contained copy for download
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CRL_HOME: ${{ github.workspace }}
          CRL_INLINE_ICONS: '1'
        run: |
          python build_dashboard.py
          mv crl_opponent_scout.html crl_opponent_scout_standalone.html
          gzip -9 crl_opponent_scout_standalone.html

      - name: Upload dashboard artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true          # storage quota must never fail an otherwise-good run
        uses: actions/upload-artifact@v6
        with:
          name: crl-dashboard
          path: crl_opponent_scout_standalone.html.gz
          retention-days: 2
          overwrite: true
