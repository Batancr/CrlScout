name: Update CRL data & dashboard

# Fetches fresh Clash Royale battle logs, rebuilds the workbook + dashboard, and commits the
# results back to the repo. The large dashboard HTML is published as a build artifact instead
# of being committed, to keep the repo from bloating.

on:
  schedule:
    - cron: '0 */6 * * *'        # every 6 hours (UTC)
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: crl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Fetch latest battle logs (via RoyaleAPI proxy)
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          CR_API_BASE: https://proxy.royaleapi.dev/v1
        run: python fetch_cr_battlelogs.py

      - name: Rebuild workbook + dashboard
        env:
          CRL_HOME: ${{ github.workspace }}
        run: |
          set -e
          python build_duel_workbook.py
          python recalc.py CRL_Duel_Decks.xlsx 300
          python add_ronin_analysis.py
          python add_group_a_analysis.py
          python add_batan_matchup_analysis.py
          python add_group_a_sequencing_analysis.py
          python add_group_a_matchup_prep.py
          python recalc.py CRL_Duel_Decks.xlsx 300
          python build_dashboard.py

      - name: Commit refreshed data (dashboard HTML kept out of git; see artifact below)
        run: |
          git config user.name  "crl-bot"
          git config user.email "actions@users.noreply.github.com"
          # Keep the large (~47MB) dashboard OUT of git history so the repo doesn't bloat.
          # It's still produced every run and published as the build artifact below.
          git rm --cached --ignore-unmatch crl_opponent_scout.html
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this run."
          else
            git commit -m "Auto update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: crl-dashboard
          path: crl_opponent_scout.html
          retention-days: 14
